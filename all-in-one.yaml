apiVersion: v1
kind: Namespace
metadata:
  name: health-stream-ml
---
# Zookeeper
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: health-stream-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.3.2
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: health-stream-ml
spec:
  ports:
  - port: 2181
  selector:
    app: zookeeper
---
# Kafka
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: health-stream-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.3.2
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: zookeeper:2181
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka:9092
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: health-stream-ml
spec:
  ports:
  - port: 9092
  selector:
    app: kafka
---
# Prometheus ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: health-stream-ml
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'model_service'
        static_configs:
          - targets: ['model-service:8000']
---
# Prometheus
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: health-stream-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: health-stream-ml
spec:
  ports:
  - port: 9090
  selector:
    app: prometheus
---
# Grafana
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: health-stream-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.0.3
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: health-stream-ml
spec:
  ports:
  - port: 3000
  selector:
    app: grafana
---
# Producer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: health-stream-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
      - name: producer
        image: health-stream-producer:latest # Needs to be pushed to a registry
        imagePullPolicy: Never
        env:
        - name: KAFKA_BROKER
          value: kafka:9092
        - name: KAFKA_TOPIC
          value: health_telemetry
---
# Model Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  namespace: health-stream-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-service
  template:
    metadata:
      labels:
        app: model-service
    spec:
      containers:
      - name: model-service
        image: health-stream-model:latest # Needs to be pushed to a registry
        imagePullPolicy: Never
        env:
        - name: KAFKA_BROKER
          value: kafka:9092
        - name: KAFKA_TOPIC
          value: health_telemetry
        - name: METRICS_PORT
          value: "8000"
---
apiVersion: v1
kind: Service
metadata:
  name: model-service
  namespace: health-stream-ml
spec:
  ports:
  - port: 8000
  selector:
    app: model-service
---
# API Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: health-stream-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: api-service
        image: health-stream-api:latest # Needs to be pushed to a registry
        imagePullPolicy: Never
        env:
        - name: PROMETHEUS_URL
          value: http://prometheus:9090
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: health-stream-ml
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  selector:
    app: api-service
